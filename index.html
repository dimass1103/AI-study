<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>🦄 Unicorn Catcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body { background: #87CEEB; }
    #game { width: 100%; height: 100%; position: relative; overflow: hidden; }
    .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 100%); }
    .grass { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(0deg, #228B22 0%, #90EE90 100%); border-radius: 50% 50% 0 0 / 20px 20px 0 0; }
    .cloud { position: absolute; background: #fff; border-radius: 50px; opacity: 0.9; }
    .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
    .score-board { position: absolute; top: 10px; left: 0; right: 0; text-align: center; z-index: 100; }
    .score-label { font-size: 12px; color: #666; font-weight: 600; }
    .score-value { font-size: 36px; font-weight: bold; color: #FF69B4; text-shadow: 2px 2px 0 #fff; }
    .missed-row { display: flex; justify-content: center; gap: 20px; margin-top: 5px; }
    .missed-item { display: flex; align-items: center; gap: 4px; }
    .missed-label { font-size: 11px; color: #666; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ddd; display: inline-block; }
    .dot.missed { background: #FF6B6B; }
    .ring-item { position: absolute; border-radius: 50%; border: 4px solid; }
    .balloon-item { position: absolute; border-radius: 50%; }
    .balloon-item::after { content: ''; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); width: 2px; height: 20px; background: #888; }
    .balloon-knot { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 6px; height: 6px; background: inherit; border-radius: 1px; }
    .balloon-shine { position: absolute; width: 16%; height: 16%; background: rgba(255,255,255,0.6); border-radius: 50%; top: 25%; left: 25%; }

    /* Unicorn */
    .unicorn { position: absolute; width: 100px; height: 120px; }
    .u-body { position: absolute; width: 70px; height: 50px; background: #FFB6C1; border-radius: 25px; bottom: 20px; left: 15px; }
    .u-belly { position: absolute; width: 50px; height: 30px; background: #FFC0CB; border-radius: 15px; bottom: 22px; left: 25px; }
    .u-head { position: absolute; width: 48px; height: 44px; background: #FFB6C1; border-radius: 24px; top: 8px; right: 8px; }
    .u-snout { position: absolute; width: 28px; height: 20px; background: #FFB6C1; border-radius: 14px; top: 26px; right: 2px; }
    .u-nostril { position: absolute; width: 4px; height: 3px; background: #FF69B4; border-radius: 50%; top: 32px; right: 6px; }
    .u-smile { position: absolute; width: 10px; height: 5px; border-bottom: 2px solid #FF69B4; border-radius: 0 0 5px 5px; top: 36px; right: 8px; }
    .u-eye-white { position: absolute; width: 18px; height: 20px; background: #fff; border-radius: 9px; top: 14px; right: 20px; border: 1.5px solid #333; }
    .u-iris { position: absolute; width: 12px; height: 12px; background: #4A90D9; border-radius: 6px; top: 17px; right: 22px; }
    .u-pupil { position: absolute; width: 7px; height: 8px; background: #1A1A2E; border-radius: 3.5px; top: 19px; right: 24px; }
    .u-sparkle1 { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; top: 17px; right: 23px; }
    .u-sparkle2 { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; top: 23px; right: 27px; }
    .u-lash1, .u-lash2, .u-lash3 { position: absolute; width: 2px; height: 7px; background: #333; border-radius: 1px; top: 8px; }
    .u-lash1 { right: 18px; transform: rotate(-25deg); }
    .u-lash2 { right: 24px; }
    .u-lash3 { right: 30px; transform: rotate(25deg); }
    .u-eyebrow { position: absolute; width: 14px; height: 3px; background: #CC8899; border-radius: 2px; top: 9px; right: 22px; }
    .u-blush1 { position: absolute; width: 10px; height: 6px; background: #FF69B4; border-radius: 50%; opacity: 0.4; top: 34px; right: 28px; }
    .u-blush2 { position: absolute; width: 8px; height: 5px; background: #FF69B4; border-radius: 50%; opacity: 0.3; top: 38px; right: 16px; }
    .u-ear { position: absolute; width: 10px; height: 16px; background: #FFB6C1; border-radius: 50%; top: -2px; right: 26px; transform: rotate(-15deg); }
    .u-ear-inner { position: absolute; width: 5px; height: 10px; background: #FF69B4; border-radius: 3px; top: 2px; right: 29px; transform: rotate(-15deg); }
    .u-horn { position: absolute; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 26px solid #FFD700; top: -18px; right: 22px; }
    .u-horn-mid { position: absolute; width: 12px; height: 18px; background: #FFD700; border-radius: 2px; top: -18px; right: 22px; }
    .u-horn-tip { position: absolute; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 10px solid #FFA500; top: -28px; right: 24px; }
    .u-horn-s1 { position: absolute; width: 8px; height: 2px; background: #FFA500; border-radius: 1px; top: -10px; right: 24px; }
    .u-horn-s2 { position: absolute; width: 6px; height: 2px; background: #FFA500; border-radius: 1px; top: -4px; right: 25px; }
    .u-mane1 { position: absolute; width: 30px; height: 30px; background: #FF69B4; border-radius: 15px; top: 2px; right: 36px; }
    .u-mane2 { position: absolute; width: 26px; height: 36px; background: #FF1493; border-radius: 13px; top: 14px; right: 42px; }
    .u-mane3 { position: absolute; width: 24px; height: 42px; background: #DB7093; border-radius: 12px; top: 24px; right: 47px; }
    .u-mane4 { position: absolute; width: 22px; height: 46px; background: #FF69B4; border-radius: 11px; top: 32px; right: 52px; }
    .u-mane5 { position: absolute; width: 18px; height: 38px; background: #C71585; border-radius: 9px; top: 42px; right: 55px; }
    .u-mane6 { position: absolute; width: 16px; height: 32px; background: #FFB6C1; border-radius: 8px; top: 50px; right: 58px; }
    .u-mane-h1 { position: absolute; width: 10px; height: 18px; background: rgba(255,255,255,0.3); border-radius: 5px; top: 6px; right: 40px; }
    .u-mane-h2 { position: absolute; width: 8px; height: 16px; background: rgba(255,255,255,0.25); border-radius: 4px; top: 28px; right: 52px; }
    .u-forelock1 { position: absolute; width: 16px; height: 20px; background: #FF69B4; border-radius: 8px; top: 0px; right: 14px; }
    .u-forelock2 { position: absolute; width: 12px; height: 22px; background: #FF1493; border-radius: 6px; top: -2px; right: 18px; }
    .u-forelock3 { position: absolute; width: 10px; height: 18px; background: #FFB6C1; border-radius: 5px; top: 2px; right: 22px; }
    .u-tail1 { position: absolute; width: 24px; height: 36px; background: #FF69B4; border-radius: 12px; top: 52px; left: 2px; transform: rotate(-20deg); }
    .u-tail2 { position: absolute; width: 20px; height: 32px; background: #FFB6C1; border-radius: 10px; top: 60px; left: 6px; transform: rotate(-5deg); }
    .u-tail3 { position: absolute; width: 18px; height: 30px; background: #FF1493; border-radius: 9px; top: 48px; left: -2px; transform: rotate(-35deg); }
    .u-leg { position: absolute; width: 12px; height: 34px; background: #FFB6C1; border-radius: 6px; bottom: 0; }
    .u-leg1 { left: 28px; }
    .u-leg2 { left: 42px; }
    .u-leg3 { left: 78px; }
    .u-leg4 { left: 92px; }
    .u-hoof { position: absolute; width: 12px; height: 7px; background: #FF69B4; border-radius: 3px; bottom: 0; }
    .u-hoof1 { left: 28px; }
    .u-hoof2 { left: 42px; }
    .u-hoof3 { left: 78px; }
    .u-hoof4 { left: 92px; }

    /* Screens */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
    .hidden { display: none !important; }

    /* Start screen */
    .start-emoji { font-size: 80px; margin-top: 20vh; }
    .start-title { font-size: 36px; font-weight: bold; color: #FF69B4; text-shadow: 2px 2px 0 #fff; margin-top: 10px; }
    .start-sub { font-size: 16px; color: #666; margin-top: 8px; font-weight: 600; }
    .instructions { margin-top: 20px; padding: 0 20px; }
    .instr-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: rgba(255,255,255,0.8); padding: 10px 14px; border-radius: 12px; font-size: 14px; color: #333; }
    .instr-emoji { font-size: 22px; }
    .btn-play { margin-top: 30px; background: #FF69B4; color: #fff; font-size: 22px; font-weight: bold; padding: 14px 60px; border-radius: 30px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(255,105,180,0.4); }
    .btn-lb { margin-top: 12px; background: #fff; color: #FF69B4; font-size: 18px; font-weight: bold; padding: 12px 40px; border-radius: 30px; border: 2px solid #FFB6C1; cursor: pointer; margin-bottom: 100px; }

    /* Leaderboard */
    .lb-title { font-size: 28px; font-weight: bold; color: #FF69B4; margin-top: 60px; }
    .lb-list { flex: 1; width: 100%; padding: 20px; overflow-y: auto; }
    .lb-item { display: flex; align-items: center; padding: 12px; background: rgba(255,255,255,0.9); border-radius: 12px; margin-bottom: 8px; }
    .lb-rank { width: 40px; font-size: 22px; text-align: center; }
    .lb-name { flex: 1; font-size: 16px; font-weight: 600; color: #333; }
    .lb-score { font-size: 20px; font-weight: bold; color: #FF69B4; }
    .lb-date { font-size: 11px; color: #999; }
    .lb-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .lb-empty-emoji { font-size: 60px; }
    .lb-empty-text { font-size: 22px; font-weight: bold; color: #FF69B4; margin-top: 10px; }

    /* Game over modal */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .modal-box { background: #fff; border-radius: 20px; padding: 30px; text-align: center; width: 80%; max-width: 300px; }
    .modal-title { font-size: 26px; font-weight: bold; color: #FF69B4; }
    .modal-score { font-size: 20px; color: #333; margin: 10px 0; }
    .modal-input { width: 100%; padding: 12px; border: 2px solid #FFB6C1; border-radius: 10px; font-size: 16px; text-align: center; margin: 10px 0; outline: none; }
    .modal-btn { background: #FF69B4; color: #fff; font-size: 16px; font-weight: bold; padding: 12px 30px; border-radius: 25px; border: none; cursor: pointer; }

    /* Pause button */
    .pause-btn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; background: rgba(255,255,255,0.9); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 101; cursor: pointer; border: none; }

    /* Pop effect */
    .pop { animation: popAnim 0.3s ease-out; }
    @keyframes popAnim {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* Score popup */
    .score-pop { position: absolute; font-size: 24px; font-weight: bold; color: #FFD700; text-shadow: 1px 1px 0 #fff; animation: scoreFloat 0.8s ease-out forwards; pointer-events: none; z-index: 150; }
    @keyframes scoreFloat {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
    }

    /* Unicorn bounce */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .unicorn-bounce { animation: bounce 1s ease-in-out infinite; }

    /* Back button */
    .btn-back { margin-top: auto; margin-bottom: 20px; background: #FF69B4; color: #fff; font-size: 18px; font-weight: bold; padding: 12px 40px; border-radius: 25px; border: none; cursor: pointer; }

    /* Stars decoration */
    .star { position: absolute; font-size: 16px; opacity: 0.6; animation: twinkle 2s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="/game.js"></script>
</body>
</html>
